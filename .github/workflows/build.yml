name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        include:
          - os: linux
            arch: arm
          - os: linux
            arch: 386
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o "dist/docker-upstream-manager-${{ matrix.os }}-${{ matrix.arch }}" .
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: docker-upstream-manager-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/docker-upstream-manager-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error